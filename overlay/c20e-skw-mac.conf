# Give the Wi-Fi a stable MAC address.
#
# The SV6160 on this board has no NV/calibration blob (the boot log shows
# "nv_mem_name is NULL" and "nv_size=0"), so skw_core.c falls through to
# eth_random_addr() and invents a new MAC on EVERY boot. Ten captured boots
# produced ten different addresses, all fe:fd:fc:xx:xx:xx, which is why the
# tablet's DHCP lease -- and therefore its IP -- changed every single reboot.
#
# skw exposes the MAC as a module parameter, and only falls back to a random
# one when what it is given is not a valid ether address.
#
# 02: is a locally administered unicast address, which is the correct range
# for a synthesised MAC. Change the last three octets if you ever run two of
# these tablets on the same network.
options skw mac=0x02,0xc2,0x0e,0x5b,0x41,0x17
