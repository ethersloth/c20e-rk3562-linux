# C20e: tablet power-key behaviour.
#
# Fedora's default is HandlePowerKey=poweroff, which logind applies whenever
# no desktop session intercepts the key -- e.g. at the login screen. On a
# tablet a short press should sleep, not power off: an accidental press, and
# the power key a Bluetooth keyboard reports (logind watches every device
# with KEY_POWER), both shut the tablet down (2026-09-22). Long press still
# powers off. Inside a Plasma session PowerDevil handles the key itself.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
