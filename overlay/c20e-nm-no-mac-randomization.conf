# Stop NetworkManager randomising the Wi-Fi MAC.
#
# The Seekwave SV6160 driver cannot change the MAC of a live interface. When
# NM tries, the kernel returns -EIO and NM gives up on the device entirely:
#
#   platform-linux: do-change-link[2]: failure 5 (Input/output error)
#   device (wlan0): set-hw-addr: failed to set MAC address to 46:21:B5:80:F1:3A (scanning)
#   device (wlan0): state change: disconnected -> unavailable
#
# wlan0 associates and even picks up an address first, then goes unavailable
# roughly 30s later when the first randomised scan happens -- which looks like
# "Wi-Fi connects then dies" rather than a MAC problem.
#
# scan-rand-mac-address covers scanning; cloned-mac-address=permanent stops NM
# randomising per-connection as well. The MAC itself is pinned in
# /etc/modprobe.d/c20e-skw-mac.conf, because the chip has no NV blob and the
# driver would otherwise invent a new one on every boot.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent
