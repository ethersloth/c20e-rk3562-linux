# zram swap sizing for this 3 GB tablet.
#
# Fedora's default is min(ram, 8192), i.e. 2.9 GB here. Measured compression on
# this board is ~3.4x (lzo-rle), so that cap wastes the benefit: zram only
# consumes RAM as it fills, and a larger device simply lets more anonymous
# memory stay resident-but-compressed instead of the system thrashing.
[zram0]
zram-size = min(ram * 2, 6144)
