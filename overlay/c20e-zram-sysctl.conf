# Memory tuning for a 3 GB tablet whose swap is zram (compressed RAM).
#
# Fedora's defaults assume swap is a disk, so they avoid swapping and drop
# cached file pages instead -- which on this board means re-reading them from
# eMMC, with kswapd burning 75% of a core while Chrome runs (seen 2026-09-22).
# Swapping to zram is a memcpy plus compression, so it should be preferred:
#   swappiness=180        prefer compressing anonymous pages over dropping cache
#   page-cluster=0        no swap-in readahead; zram has no seek cost
#   watermark_scale_factor=125  start reclaiming earlier, before allocations stall
# Measured on the tablet: free RAM 142 MB -> 304 MB, zram 3.4x compression.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_scale_factor = 125
