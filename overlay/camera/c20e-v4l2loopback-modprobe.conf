# The C20e's ISP capture node (/dev/video22, driver rkisp_v8) is a MULTIPLANAR
# V4L2 device, and almost nothing in userspace accepts those:
#   - Qt Multimedia's default (ffmpeg) backend wants V4L2_CAP_VIDEO_CAPTURE, so
#     Plasma Camera reports "Camera not available"
#   - PipeWire's V4L2 monitor lists the node as a device but creates no camera
#     source from it, for the same reason
#   - libcamera has a pipeline handler for the mainline rkisp1 driver, not for
#     this vendor one
# v4l2loopback gives us one ordinary single-planar device that every application
# understands; c20e-camera-bridge feeds it from the ISP.
#
# exclusive_caps=1 is required: it makes the device announce CAPTURE only once a
# producer is attached, which is what Chrome, Firefox and Qt expect of a webcam.
options v4l2loopback devices=1 video_nr=40 card_label="C20e Camera" exclusive_caps=1 max_buffers=4
