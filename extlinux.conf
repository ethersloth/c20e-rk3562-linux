# Ship the debug label as default.
#
# The "linux" label boots with quiet, loglevel=0, nosplash and fbcon=map:1 and
# no console=tty1, so the screen stays completely black -- including for kernel
# panics. On a freshly flashed card that also boots to multi-user.target (no
# desktop, and the framebuffer logo only runs at graphical.target), the result
# is indistinguishable from a board that will not boot at all.
#
# c20e-firstboot switches this to "default linux" once setup completes, so the
# quiet boot is what you get in normal use. Keep the visible one until then.
default linux-debug
timeout 30
menu title RK3562 Boot

label linux
  kernel /Image
  fdt /rk3562.dtb
  append earlycon=uart8250,mmio32,0xff210000 console=ttyS0,1500000n8 quiet nosplash fbcon=map:1 loglevel=0 systemd.show_status=false rd.systemd.show_status=false udev.log_priority=0 plymouth.ignore-serial-consoles vt.global_cursor_default=0 video=DSI-1:800x1280@60,rotate=90 rw root=PARTUUID=c0ffee11-2233-4455-6677-8899aabbccdd rootfstype=ext4 rootwait panic=10

label linux-debug
  kernel /Image
  fdt /rk3562.dtb
  append earlycon=uart8250,mmio32,0xff210000 console=ttyS0,1500000n8 console=tty1 video=DSI-1:800x1280@60,rotate=90 rw root=PARTUUID=c0ffee11-2233-4455-6677-8899aabbccdd rootfstype=ext4 rootwait panic=10

# Memory-corruption hunt. Boots exactly like linux-debug plus slub_debug.
#
# The corruption only appears once the graphical session runs: captured boots
# to multi-user.target produced 0 oopses, while the two boots to
# graphical.target produced 4 and 7. Most faults are victims reading a
# clobbered struct nameidata off the kernel stack in link_path_walk, but one
# landed directly in vop2_crtc_destroy_state under commit_work, which is the
# DRM atomic teardown path.
#
# CONFIG_SLUB_DEBUG=y is already compiled in but dormant (SLUB_DEBUG_ON is
# not set), so this needs no rebuild. The flags:
#   F  extra sanity checks on free
#   Z  red zoning, catches writes just past an allocation
#   P  poisoning, catches use-after-free reads/writes
#   U  user tracking, records the alloc and free stack traces
# U is the important one: when SLUB trips, it prints WHO allocated and WHO
# freed the object, which names the culprit instead of leaving us to infer
# it from whichever innocent structure got hit.
#
# Expect this to be slower and to fill the log. That is fine for a diagnosis
# run; do not ship it as the default.
label linux-slub
  kernel /Image
  fdt /rk3562.dtb
  append earlycon=uart8250,mmio32,0xff210000 console=ttyS0,1500000n8 console=tty1 video=DSI-1:800x1280@60,rotate=90 rw root=PARTUUID=c0ffee11-2233-4455-6677-8899aabbccdd rootfstype=ext4 rootwait panic=10 slub_debug=FZPU

label linux-fallback
  kernel /Image
  fdt /rk3562-fallback.dtb
  append earlycon=uart8250,mmio32,0xff210000 console=ttyS0,1500000n8 quiet nosplash fbcon=map:1 loglevel=0 systemd.show_status=false rd.systemd.show_status=false udev.log_priority=0 plymouth.ignore-serial-consoles vt.global_cursor_default=0 video=DSI-1:800x1280@60,rotate=90 rw root=PARTUUID=c0ffee11-2233-4455-6677-8899aabbccdd rootfstype=ext4 rootwait panic=10

label linux-fallback-debug
  kernel /Image
  fdt /rk3562-fallback.dtb
  append earlycon=uart8250,mmio32,0xff210000 console=ttyS0,1500000n8 console=tty1 video=DSI-1:800x1280@60,rotate=90 rw root=PARTUUID=c0ffee11-2233-4455-6677-8899aabbccdd rootfstype=ext4 rootwait panic=10
